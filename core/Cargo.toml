[package]
name = "webinarip-core"
description = "Download and mix HLS webinar recordings: parallel participant tracks, AIMD downloader, streaming mixer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bytes = "1.12.1"
chrono = "0.4.45"
dirs = "7.0.0"
hound = "3.5.1"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "webpki-tokio", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
mp3lame-encoder = "0.2.5"
ogg = "0.9.2"
opus-rs = "0.1.34"
serde_json = "1.0.151"
symphonia = { version = "0.6.1", default-features = false, features = ["isomp4", "aac"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
url = "2.5.8"
wide = "1.7.1"

[dev-dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["server", "http1", "tokio"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time"] }
