[package]
name = "webinarip"
description = "Download a webinar recording as one MP3 / Opus / AAC in seconds"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
indicatif = "0.18.6"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
webinarip-core = { version = "0.1.2", path = "../core" }
webinarip-server = { version = "0.1.2", path = "../server" }
